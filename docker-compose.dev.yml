services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ai402
      POSTGRES_USER: ai402
      POSTGRES_PASSWORD: localpassword
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai402 -d ai402"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_dev_data:
